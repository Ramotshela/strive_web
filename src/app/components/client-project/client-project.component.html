<div class="row">
  <div class="col-12">
    <div class="card">
      <div
        class="card-header bg-success d-flex justify-content-between align-items-center text-white"
      >
        <h5 class="mb-0">Client List</h5>
        <button (click)="ToClientProjectForm()" class="btn btn-secondary">
          Add Project
        </button>
      </div>

      <div class="card-body">
        <div class="row">
          <div class="col-12">
            <table class="table table-bordered">
              <thead>
                <tr>
                  <th>Sr No</th>
                  <th>Project Name</th>
                  <th>Person Name</th>
                  <th>Contact No</th>
                  <th>start date</th>
                  <th>end date</th>

                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                @for(item of clientProjectList();track $index){
                <tr>
                  <td>{{ $index + 1 }}</td>
                  <td>{{ item.projectName }}</td>
                  <td>{{ item.clientName }}</td>
                  <td>{{ item.empEmailId }}</td>
                  <td>{{ item.expectedEndDate | date }}</td>
                  <td>{{ item.startDate | date }}</td>

                  <td>
                    <button
                      type="button"
                      (click)="OnDelete(item.clientProjectId)"
                      class="btn btn-danger"
                    >
                      Delete
                    </button>
                  </td>
                </tr>
                }
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
