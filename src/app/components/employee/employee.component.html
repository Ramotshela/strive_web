<div class="card">
  <div class="card-header bg-success">Employee List</div>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Sr No</th>
        <th>Name</th>
        <th>Email</th>
        <th>Employee Code</th>
        <th>start date</th>
        <th>Total years</th>
        <th>total Month</th>
      </tr>
    </thead>
    <tbody>
      @for(item of employeeList();track $index){
      <tr>
        <td>{{ $index + 1 }}</td>
        <td>{{ item.empName | uppercase }}</td>
        <td>{{ item.empEmailId }}</td>
        <td>{{ item.empCode }}</td>
        <td>{{ item.empExpTotalYear }}</td>
        <td>{{ item.empExpTotalMonth }}</td>
      </tr>
      }
    </tbody>
  </table>
</div>
