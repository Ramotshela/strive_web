<div class="row mt-3">
  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">
        <h5 class="mb-0">Role List</h5>
      </div>

      <div class="card-body p-0">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-success text-center">
            <tr>
              <th scope="col">Sr No</th>
              <th scope="col">Role Name</th>
            </tr>
          </thead>
          @if(role.length > 0 || role.length ==null ){
          <tbody>
            @for(rol of role;track $index){
            <tr>
              <td class="text-center">{{ $index + 1 }}</td>
              <td>{{ rol.role }}</td>
            </tr>
            }
          </tbody>
          }@else {
          <ng-template #noRoles>
            <div class="text-center p-3 text-muted">No roles available.</div>
          </ng-template>
          }
        </table>

        <!-- Fallback when no roles are available -->
      </div>
    </div>
  </div>
</div>
