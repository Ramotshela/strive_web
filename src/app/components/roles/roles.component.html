<div class="row">
  <div class="col-12">
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Sr No</th>
          <th>Role Name</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let rol of role; let serno = index">
          <td>{{ serno }}</td>
          <td>{{ rol.role }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
